name: Generate Demo GIF

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "demo.tape"
      - ".github/workflows/generate-demo-gif.yml"

jobs:
  generate-gif:
    name: Render Animated Terminal GIF (VHS)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: "pip"

    - name: Install CloakDB in editable mode
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Render VHS Demo Tape
      uses: charmbracelet/vhs-action@v2
      with:
        path: "demo.tape"

    - name: Upload GIF as Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: demo-gif
        path: assets/demo.gif
        if-no-files-found: error

    - name: Commit and Push Updated Demo GIF
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add assets/demo.gif
        if ! git diff --staged --quiet; then
          git commit -m "docs(assets): update animated demo.gif via VHS workflow"
          git push
        else
          echo "No changes in demo.gif"
        fi
